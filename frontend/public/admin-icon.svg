<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e1d" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052014" />
    </linearGradient>

    <!-- Gold Shield Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0d3b1e" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />

  <!-- Outer Shield Outline with Shadow -->
  <g filter="url(#shadow)">
    <!-- Golden Outer Shield -->
    <path d="M 256 68 
             C 334 68 406 100 416 128 
             C 416 264 374 380 256 444 
             C 138 380 96 264 96 128 
             C 106 100 178 68 256 68 Z" 
          fill="url(#goldGrad)" />

    <!-- Inner Dark Emerald Shield -->
    <path d="M 256 86 
             C 324 86 388 114 396 138 
             C 396 256 358 358 256 422 
             C 154 358 116 256 116 138 
             C 124 114 188 86 256 86 Z" 
          fill="url(#innerShield)" />
  </g>

  <!-- Golden Trim Details inside Shield -->
  <path d="M 256 104 
           C 310 104 366 128 374 148 
           C 374 244 340 334 256 394 
           C 172 334 138 244 138 148 
           C 146 128 202 104 256 104 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Center Emblem: Administrative Pillar & Civic Star -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- 8-Point Civic Star / Chakra -->
    <circle cx="0" cy="-30" r="38" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="0" cy="-30" r="28" fill="#14532d" />
    <circle cx="0" cy="-30" r="10" fill="url(#goldGrad)" />
    
    <!-- Radiating Chakra Rays -->
    <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-4" />
      <line x1="-26" y1="-30" x2="26" y2="-30" />
      <line x1="-18" y1="-48" x2="18" y2="-12" />
      <line x1="18" y1="-48" x2="-18" y2="-12" />
    </g>

    <!-- Administrative Seal Building / Gram Sachivalaya Pillars -->
    <!-- Pediment Roof -->
    <polygon points="0,-2 68,26 -68,26" fill="url(#goldGrad)" />
    
    <!-- Roof Beam -->
    <rect x="-74" y="26" width="148" height="10" rx="3" fill="url(#goldGrad)" />
    
    <!-- 4 Majestic Columns -->
    <rect x="-62" y="38" width="16" height="54" rx="2" fill="url(#goldGrad)" />
    <rect x="-24" y="38" width="16" height="54" rx="2" fill="url(#goldGrad)" />
    <rect x="8" y="38" width="16" height="54" rx="2" fill="url(#goldGrad)" />
    <rect x="46" y="38" width="16" height="54" rx="2" fill="url(#goldGrad)" />

    <!-- Foundation Base -->
    <rect x="-76" y="94" width="152" height="12" rx="3" fill="url(#goldGrad)" />
    <rect x="-84" y="108" width="168" height="12" rx="3" fill="url(#goldGrad)" />
  </g>

  <!-- Ribbon Banner at Bottom of Shield -->
  <g transform="translate(256, 386)">
    <!-- Banner Shadow -->
    <path d="M -110 0 L 110 0 L 94 28 L -94 28 Z" fill="#000" opacity="0.4" />
    <!-- Banner Front -->
    <path d="M -104 -4 L 104 -4 L 90 24 L -90 24 Z" fill="url(#goldGrad)" />
    <text x="0" y="16" 
          font-family="system-ui, -apple-system, 'Noto Sans Devanagari', sans-serif" 
          font-size="16" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#14532d" 
          text-anchor="middle">
      आसगाव प्रशासन
    </text>
  </g>
</svg>
